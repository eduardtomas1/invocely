name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java ${{ matrix.java }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 25]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify application
        run: ./mvnw -B -ntp verify
      - name: Verify packaged application and legal notices
        run: |
          standalone=(target/*-standalone.jar)
          smoke_dir="$(mktemp -d)"
          java -jar "${standalone[0]}" --verify-distribution "$smoke_dir"
          test -s "$smoke_dir/verification.pdf"
          test -s "$smoke_dir/verification.xlsx"
          test -s "$smoke_dir/verification.csv"
          unzip -tq "${standalone[0]}"
          unzip -Z1 "${standalone[0]}" | grep -Fx META-INF/licenses/Invoicely-Apache-2.0.txt
          unzip -Z1 "${standalone[0]}" | grep -Fx META-INF/licenses/JasperReports-LGPL-3.0.txt
          unzip -Z1 "${standalone[0]}" | grep -Fx META-INF/invocely-THIRD-PARTY.txt
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-java-${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  macos-package:
    name: macOS installer smoke test
    needs: test
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build installer
        run: ./scripts/package-macos.sh
      - name: Verify disk image
        run: hdiutil verify dist/*.dmg
      - name: Verify mounted application and bundled exports
        run: |
          mount_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          dmg=(dist/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmg[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT
          app="$mount_dir/Invoicely.app"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "app.invocely.desktop"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "11.0"
          ! plutil -p "$app/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription
          runtime_image="$app/Contents/runtime/Contents/Home/lib/modules"
          jimage list "$runtime_image" | grep -q '^Module: java.compiler$'
          ! jimage list "$runtime_image" | grep -q '^Module: jdk.compiler$'
          "$app/Contents/MacOS/Invoicely" --verify-distribution "$smoke_dir"
          test -s "$smoke_dir/verification.pdf"
          test -s "$smoke_dir/verification.xlsx"
          test -s "$smoke_dir/verification.csv"
      - name: Preserve review installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invocely-macos
          path: dist/*.dmg
          if-no-files-found: error
