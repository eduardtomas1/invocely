name: Trusted release

on:
  push:
    tags:
      - "v1.1.*"

permissions:
  contents: read

concurrency:
  group: trusted-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Set up Java 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - name: Match the tag, commit, and Maven version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Trusted releases must be triggered by a tag."
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(1\.1\.[0-9]+)$ ]]; then
            echo "::error::Release tag must match v1.1.N, where N is numeric."
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          pom_version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${pom_version}" != "${version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match Maven version ${pom_version}."
            exit 1
          fi
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "${tag_commit}" != "${event_commit}" || "$(git rev-parse 'HEAD^{commit}')" != "${tag_commit}" ]]; then
            echo "::error::Checked-out commit does not match the pushed tag."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  release:
    name: Sign, notarize, and draft release
    needs: validate
    runs-on: macos-15
    environment: trusted-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Revalidate release metadata
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::The v1.1.x macOS release must run on an Apple-silicon runner."
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(1\.1\.[0-9]+)$ ]]; then
            echo "::error::Release tag must match v1.1.N, where N is numeric."
            exit 1
          fi
          pom_version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "${pom_version}" != "${RELEASE_VERSION}" || "${BASH_REMATCH[1]}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::Release metadata changed between validation and packaging."
            exit 1
          fi
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "${tag_commit}" != "${event_commit}" || "$(git rev-parse 'HEAD^{commit}')" != "${tag_commit}" ]]; then
            echo "::error::Release checkout is not the tagged commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::A release already exists for ${RELEASE_TAG}; refusing to replace it."
            exit 1
          fi
      - name: Require trusted-release credentials
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          missing=0
          for name in \
            APPLE_API_ISSUER_ID \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            MACOS_CERTIFICATE_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::The trusted-release environment is missing ${name}."
              missing=1
            fi
          done
          if (( missing != 0 )); then
            echo "::error::Refusing to create an untrusted release."
            exit 1
          fi
          if [[ "${MACOS_SIGNING_IDENTITY}" != "Developer ID Application:"* ]]; then
            echo "::error::MACOS_SIGNING_IDENTITY must name a Developer ID Application identity."
            exit 1
          fi
      - name: Build standalone JAR and CycloneDX SBOM
        run: |
          ./mvnw -B -ntp -Prelease clean verify
          mkdir -p dist
          jar="target/invocely-${RELEASE_VERSION}-standalone.jar"
          sbom="target/invocely-${RELEASE_VERSION}.cdx.json"
          test -s "${jar}"
          test -s "${sbom}"

          smoke_dir="$(mktemp -d)"
          java -jar "${jar}" --verify-distribution "${smoke_dir}"
          test -s "${smoke_dir}/verification.pdf"
          test -s "${smoke_dir}/verification.xlsx"
          test -s "${smoke_dir}/verification.csv"
          unzip -tq "${jar}"

          cp "${jar}" "${sbom}" dist/
      - name: Build, Developer ID sign, and notarize DMG
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INVOCELY_MAC_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey.p8"
          signing_keychain="${RUNNER_TEMP}/invocely-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          cleanup() {
            security delete-keychain "${signing_keychain}" >/dev/null 2>&1 || true
            rm -f "${certificate_path}" "${notary_key_path}"
          }
          trap cleanup EXIT

          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${notary_key_path}"
          chmod 600 "${certificate_path}" "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${signing_keychain}"
          security set-keychain-settings -lut 21600 "${signing_keychain}"
          security unlock-keychain -p "${keychain_password}" "${signing_keychain}"
          security import "${certificate_path}" \
            -k "${signing_keychain}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T "${JAVA_HOME}/bin/jpackage"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${signing_keychain}" >/dev/null
          security list-keychains -d user -s "${signing_keychain}"
          if ! security find-identity -v -p codesigning "${signing_keychain}" \
            | grep -Fq "\"${INVOCELY_MAC_SIGNING_IDENTITY}\""; then
            echo "::error::The imported certificate does not provide MACOS_SIGNING_IDENTITY."
            exit 1
          fi

          export INVOCELY_MAC_SIGNING_KEYCHAIN="${signing_keychain}"
          ./scripts/package-macos.sh --skip-build

          dmg=(dist/Invoicely-"${RELEASE_VERSION}"-macos-*.dmg)
          if (( ${#dmg[@]} != 1 )) || [[ ! -s "${dmg[0]}" ]]; then
            echo "::error::Expected exactly one architecture-labelled DMG."
            exit 1
          fi

          codesign --force \
            --sign "${INVOCELY_MAC_SIGNING_IDENTITY}" \
            --keychain "${signing_keychain}" \
            --timestamp \
            "${dmg[0]}"

          notary_result="${RUNNER_TEMP}/notary-result.json"
          xcrun notarytool submit "${dmg[0]}" \
            --key "${notary_key_path}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --wait \
            --output-format json | tee "${notary_result}"

          notary_status="$(plutil -extract status raw -o - "${notary_result}")"
          if [[ "${notary_status}" != "Accepted" ]]; then
            notary_id="$(plutil -extract id raw -o - "${notary_result}")"
            xcrun notarytool log "${notary_id}" \
              --key "${notary_key_path}" \
              --key-id "${APPLE_API_KEY_ID}" \
              --issuer "${APPLE_API_ISSUER_ID}" \
              "${RUNNER_TEMP}/notary-log.json" || true
            test ! -f "${RUNNER_TEMP}/notary-log.json" || cat "${RUNNER_TEMP}/notary-log.json"
            echo "::error::Apple notarization finished with status ${notary_status}."
            exit 1
          fi

          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
      - name: Verify trusted macOS distribution
        run: |
          dmg=(dist/Invoicely-"${RELEASE_VERSION}"-macos-*.dmg)
          if (( ${#dmg[@]} != 1 )) || [[ ! -s "${dmg[0]}" ]]; then
            echo "::error::Expected exactly one architecture-labelled DMG."
            exit 1
          fi

          hdiutil verify "${dmg[0]}"
          codesign --verify --strict --verbose=2 "${dmg[0]}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"

          mount_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mount_dir}" "${dmg[0]}" >/dev/null
          trap 'hdiutil detach "${mount_dir}" >/dev/null' EXIT
          app="${mount_dir}/Invoicely.app"

          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --display --verbose=4 "${app}" 2>&1 | grep -Fq "Authority=Developer ID Application:"
          codesign --display --verbose=4 "${app}" 2>&1 | grep -Eq '^flags=.*runtime'
          spctl --assess --type execute --verbose=4 "${app}"
          test "$(plutil -extract CFBundleIdentifier raw "${app}/Contents/Info.plist")" = "app.invocely.desktop"
          test "$(plutil -extract LSMinimumSystemVersion raw "${app}/Contents/Info.plist")" = "11.0"
          "${app}/Contents/MacOS/Invoicely" --verify-distribution "${smoke_dir}"
          test -s "${smoke_dir}/verification.pdf"
          test -s "${smoke_dir}/verification.xlsx"
          test -s "${smoke_dir}/verification.csv"
      - name: Generate and verify SHA-256 checksums
        run: |
          cd dist
          jar="invocely-${RELEASE_VERSION}-standalone.jar"
          sbom="invocely-${RELEASE_VERSION}.cdx.json"
          dmg=(Invoicely-"${RELEASE_VERSION}"-macos-*.dmg)
          test -s "${jar}"
          test -s "${sbom}"
          if (( ${#dmg[@]} != 1 )) || [[ ! -s "${dmg[0]}" ]]; then
            echo "::error::Expected exactly one architecture-labelled DMG."
            exit 1
          fi
          shasum -a 256 "${jar}" "${dmg[0]}" "${sbom}" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/invocely-${{ needs.validate.outputs.version }}-standalone.jar
            dist/Invoicely-${{ needs.validate.outputs.version }}-macos-*.dmg
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/invocely-${{ needs.validate.outputs.version }}-standalone.jar
            dist/Invoicely-${{ needs.validate.outputs.version }}-macos-*.dmg
          sbom-path: dist/invocely-${{ needs.validate.outputs.version }}.cdx.json
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/invocely-"${RELEASE_VERSION}"-standalone.jar \
            dist/Invoicely-"${RELEASE_VERSION}"-macos-*.dmg \
            dist/invocely-"${RELEASE_VERSION}".cdx.json \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Invoicely ${RELEASE_TAG}"
